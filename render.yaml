services:
  - type: web
    name: cybersecia-api
    runtime: python
    region: oregon
    rootDirectory: services/api_gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: cybersecia-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: API_ADMIN_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true

redis:
  - name: cybersecia-redis
    plan: free
    region: oregon
