name: CyberSec AI Ecosystem — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Red team scan diário às 02:00 UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: cybersec-ai

jobs:
  # ============================================================
  # JOB 1: Lint & Static Analysis
  # ============================================================
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 black isort bandit safety

      - name: Run flake8
        run: flake8 mcp/ agents/ --max-line-length=120 --exclude=__pycache__

      - name: Run black check
        run: black --check mcp/ agents/

      - name: Run isort check
        run: isort --check-only mcp/ agents/

      - name: Security scan with bandit
        run: bandit -r mcp/ agents/ -f json -o bandit-report.json || true

      - name: Dependency vulnerability scan
        run: safety check -r requirements.txt || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: bandit-report.json

  # ============================================================
  # JOB 2: Unit & Integration Tests
  # ============================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov coverage

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=mcp --cov=agents --cov-report=xml --cov-report=html
        env:
          REDIS_URL: redis://localhost:6379/0
          DB_URL: postgresql://postgres:test@localhost:5432/test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: htmlcov/

  # ============================================================
  # JOB 3: Build Docker Images
  # ============================================================
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        agent:
          - central_orchestrator
          - discovery
          - vulnerability
          - threat_intel
          - behavioral
          - response
          - governance
          - red_team
          - soar
          - purple_team
          - mcp_auditor
          - digital_twin
          - threat_hunt
          - compliance
          - forensic
          - correlation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/${{ matrix.agent }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.agent }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 4: Red Team Security Scan
  # ============================================================
  redteam:
    name: 🎯 Red Team Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety semgrep
          pip install pyrit garak deepteam || true

      - name: Run adversarial tests (PyRIT)
        run: |
          echo "Running PyRIT adversarial tests..."
          # pyrit run --config tests/redteam/pyrit_config.yaml || true

      - name: Run OWASP scan
        run: |
          semgrep --config=auto mcp/ agents/ --json -o semgrep-report.json || true

      - name: Generate security report
        run: |
          echo "# Red Team Security Report" > redteam-report.md
          echo "Date: $(date)" >> redteam-report.md
          echo "Commit: ${{ github.sha }}" >> redteam-report.md
          echo "" >> redteam-report.md
          echo "## Bandit Results" >> redteam-report.md
          bandit -r mcp/ agents/ -f txt >> redteam-report.md || true

      - name: Upload red team report
        uses: actions/upload-artifact@v4
        with:
          name: redteam-security-report
          path: |
            redteam-report.md
            semgrep-report.json
            bandit-report.json

  # ============================================================
  # JOB 5: Integration Test (Docker Compose)
  # ============================================================
  integration:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          docker-compose --version

      - name: Start ecosystem
        run: |
          cp .env.example .env
          make init || true
          docker-compose up -d kafka redis postgres
          sleep 30

      - name: Health check
        run: |
          docker-compose ps
          docker-compose logs kafka | tail -20

      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration --tb=short || true

      - name: Cleanup
        run: docker-compose down -v

  # ============================================================
  # JOB 6: Deploy (Main only)
  # ============================================================
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, redteam, integration]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Images: ${{ env.REGISTRY }}/${{ github.repository }}/*:${{ github.sha }}"
          # kubectl set image deployment/orchestrator orchestrator=${{ env.REGISTRY }}/${{ github.repository }}/central_orchestrator:${{ github.sha }}

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#security-ops'
          text: 'CyberSec AI Ecosystem deployed to staging'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
